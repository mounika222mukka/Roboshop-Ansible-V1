- name: create EC2 instances and R53 records
  hosts: localhost
  connection: local
  vars:
   instances: ["mongodb", "Redis", "mysql", "Rabbitmq"]
   action: create
   domain_name: devsecops92s.online
   ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "Roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups: 
      - "Roboshop- Common"
      - "Roboshop-{{ item }}"
      region: us-east-1
    loop: "{{ instances }}"  
    when: action== "create"