- name: create EC2 instances and R53 records
  hosts: localhost
  connection: local
  vars:
   instances: ["mongodb", "redis", "mysql", "Rabbitmq"]
   action: create
   domain_name: devsecops92s.online
   ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "Roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups: 
      - "Roboshop- Common"
      - "Roboshop-{{ item }}"
      region: us-east-1
    loop: "{{ instances }}"  
    when: action== "create"
    register: ec2_output 
  #- name: print ec2-output
   # debug:
    #  msg: "{{ec2_output}}"
  - name: create R53 records \
    amazon.aws.route53:
      state: present
      zone: "{{domain_name}}"
      record: "{{item.item}}.{{domain_name}}" #mongodb.devsecops92s.online#
      type: A
      ttl: 1
      value: "{{item.instances[0].private_ip_address}}" 
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action== "create"
  - name: delete route53 records  
    amazon.aws.route53:
      state: absent
      zone: "{{domain_name}}"
      record: "{{ item}}.{{domain_name}}"
      ttl: 1
      type: A
    loop: "{{instances}}"
    when: action=="delete"
  - name: delete ec2_instance
    amazon.aws.ec2_instance:
      state: absent
      name: "Roboshop-{{ item }}"
      region: us-east-1
      wait: false
    loop: "{{ instances }}"
    when: action=="delete"  


