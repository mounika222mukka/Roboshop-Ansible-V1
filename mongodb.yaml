- name: configure mongodb server
  hosts: mongodb
  become: yes
  tasks:
  - name: copy mongo repo 
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  - name: intall mongodb server
    package:
      name: mongodb-org
      state: present
  - name: start and enable mongodb 
    service:
      name: mongodb
      state: started
      enabled: yes        