- name: Consfigure mysql 
  hosts: mysql

  tasks:
  - name: enable mysql 8.4
    command: dnf module enable mysql:8.4 -y

  - name: install mysql server
    package:
      name: mysql-server
      state: present  
  - name: start and enable mysql service
    service:
      name: mysqld
      state: started
      enabled: yes
  # - name: setup mysql root password
  #   ansible.mysql.mysql_user:
  #     name: root
  #     password: "{{ mysql_root_password }}"
  #     host: localhost
      # state: present
  
  - name: setup mysql root passwd
    command: mysql_secure_installation --set-root-pass RoboShop@1
    
