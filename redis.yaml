- name: configure redis server
  hosts: redis
  become: yes

  tasks:
  - name: disable redis
    command: dnf module disable redis -y

  - name: enable redis 7
    command: dnf module enable redis:7 -y

  - name: install redis
    package:
      name: redis
      state: present
  - name: allow remote connections 
    replace:
      path: /etc/redis/redis.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'

  - name: disable protected module
    lineinfile:
      path: /etc/redis/redis.conf
      regexp: '^Protected-mode yes'
      line: 'protected-mode no'
  - name: Enable and start service
    service: 
      name: redis
      state: started
      enabled: yes

 


      
  